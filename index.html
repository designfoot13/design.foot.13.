<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Design Foot 13 - Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  background:
    radial-gradient(circle at top, #1aff6f22, transparent 45%),
    radial-gradient(circle at bottom, #00c3ff22, transparent 40%),
    linear-gradient(180deg,#050505,#0b0b0b);
  color:white;
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

/* PARTICLES BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:radial-gradient(#1aff6f55 1px, transparent 1px);
  background-size:60px 60px;
  opacity:0.15;
  pointer-events:none;
  animation:moveBg 20s linear infinite;
}

@keyframes moveBg{
  from{transform:translateY(0px)}
  to{transform:translateY(-60px)}
}

.stats-bar{
  position:fixed;
  top:0;
  width:100%;
  background:#000000dd;
  display:flex;
  justify-content:center;
  gap:60px;
  padding:12px;
  z-index:9999;
  border-bottom:1px solid #1aff6f55;
}

.stats-bar strong{
  color:#1aff6f;
  font-size:1.3em;
}

header{
  height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  margin-top:60px;
  background:
    radial-gradient(circle at center,#1aff6f11,transparent 60%),
    linear-gradient(180deg,#000000cc,#000000);
}

header h1{
  font-family:'Teko',sans-serif;
  font-size:6em;
  margin:0;
  text-shadow:0 0 40px #1aff6f;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{filter:drop-shadow(0 0 5px #1aff6f)}
  to{filter:drop-shadow(0 0 25px #1aff6f)}
}

section{
  padding:90px 8%;
}

h2{
  font-family:'Teko',sans-serif;
  font-size:3em;
  text-align:center;
  margin-bottom:60px;
  letter-spacing:2px;
}

/* PRICE BOX */
.price-box{
  text-align:center;
  margin-top:20px;
  font-size:1.2em;
  opacity:0.9;
}

.price-box span{
  color:#1aff6f;
  font-weight:bold;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:35px;
}

.card{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  box-shadow:0 25px 60px rgba(0,0,0,0.8);
  transition:0.4s;
  cursor:pointer;
}

.card img{
  width:100%;
  display:block;
  transition:0.4s;
}

.card:hover{
  transform:scale(1.05) rotateZ(-1deg);
  box-shadow:0 0 40px #1aff6f;
}

.card::after{
  content:"Voir +";
  position:absolute;
  bottom:10px;
  right:10px;
  background:#1aff6f;
  color:#000;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  opacity:0;
  transition:0.3s;
}

.card:hover::after{
  opacity:1;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
}

.modal-content{
  width:70%;
  max-width:700px;
  animation:flip 0.8s ease;
}

.modal-content img{
  width:100%;
  border-radius:15px;
  box-shadow:0 0 40px #1aff6f;
}

@keyframes flip{
  from{transform:rotateY(90deg) scale(0.5); opacity:0}
  to{transform:rotateY(0deg) scale(1); opacity:1}
}

.close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:#1aff6f;
  cursor:pointer;
}

/* CTA */
.cta a{
  display:inline-block;
  padding:18px 45px;
  background:linear-gradient(90deg,#1aff6f,#00c3ff);
  color:#000;
  font-weight:700;
  border-radius:50px;
  text-decoration:none;
  transition:0.3s;
}

.cta a:hover{
  transform:scale(1.1);
}

footer{
  background:#000;
  text-align:center;
  padding:60px 20px;
}

footer a{
  color:#1aff6f;
  margin:0 15px;
  text-decoration:none;
}

</style>
</head>

<body>

<div class="stats-bar">
  <div><strong>3000</strong><br>Abonnés</div>
</div>

<header>
  <div>
    <h1>DESIGN FOOT 13</h1>
    <p>Affiches football • Créations premium • Clubs & joueurs</p>
    <div class="price-box">
      Prix d’une affiche : <span>10€</span><br>
      Contact pour négociation ou abonnement personnalisé
    </div>
  </div>
</header>

<section>
  <h2>MES AFFICHES</h2>

  <div class="gallery">
    <div class="card"><img src="trapel-fc.jpg.PNG"></div>
    <div class="card"><img src="om.jpg.PNG"></div>
    <div class="card"><img src="tottenham.jpg.PNG"></div>
    <div class="card"><img src="manchester-united.jpg.PNG"></div>
    <div class="card"><img src="arsenal.jpg.JPG"></div>
    <div class="card"><img src="liverpool-om.jpg.PNG"></div>
    <div class="card"><img src="psg-sacre.png.png"></div>
    <div class="card"><img src="city.png.png"></div>
  </div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
  <span class="close" onclick="closeModal()">×</span>
  <div class="modal-content">
    <img id="modalImg">
  </div>
</div>

<script>
const cards = document.querySelectorAll('.card');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');

cards.forEach(card => {
  card.addEventListener('click', () => {
    modal.style.display = 'flex';
    modalImg.src = card.querySelector('img').src;
  });
});

function closeModal(){
  modal.style.display = 'none';
}

window.onclick = function(e){
  if(e.target == modal) modal.style.display = 'none';
}
</script>

</body>
</html>
